<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>小型进销存</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>📦 小型进销存</h1>
      <span class="alert-badge" id="alertBadge" style="display:none">⚠️ <span id="alertCount">0</span></span>
    </div>
  </header>

  <div class="container">
    <nav class="tabs" id="tabs">
      <button class="tab active" data-page="dashboard">📊 总览</button>
      <button class="tab" data-page="skus">📋 SKU管理</button>
      <button class="tab" data-page="inbound">📥 入库</button>
      <button class="tab" data-page="outbound">📤 出库</button>
      <button class="tab" data-page="inventory">📊 库存</button>
      <button class="tab" data-page="ledger">📜 台账</button>
    </nav>

    <!-- 总览 -->
    <section class="page active" id="page-dashboard">
      <h2>数据总览</h2>
      <div class="stats-grid" id="statsGrid"></div>
      <h3 style="margin-top:24px">⚠️ 低库存预警</h3>
      <div id="alertsList"></div>
    </section>

    <!-- SKU管理 -->
    <section class="page" id="page-skus">
      <div class="page-header">
        <h2>SKU管理</h2>
        <button class="btn btn-primary" id="btnAddSKU">＋ 新增SKU</button>
      </div>
      <div id="skuList"></div>
    </section>

    <!-- 入库 -->
    <section class="page" id="page-inbound">
      <h2>📥 入库</h2>
      <form id="inboundForm" class="form-card">
        <div class="form-row">
          <label>选择SKU <select id="inSKU" required></select></label>
          <label>数量 <input id="inQty" type="number" min="1" value="1" required /></label>
          <label>单价 <input id="inPrice" type="number" step="0.01" min="0" placeholder="0.00" /></label>
        </div>
        <div class="form-row">
          <label>备注 <input id="inRemark" type="text" placeholder="采购来源等" /></label>
          <label>操作人 <input id="inOp" type="text" placeholder="操作人" /></label>
        </div>
        <p class="error" id="inError"></p>
        <button class="btn btn-primary" type="submit">确认入库</button>
      </form>
    </section>

    <!-- 出库 -->
    <section class="page" id="page-outbound">
      <h2>📤 出库</h2>
      <form id="outboundForm" class="form-card">
        <div class="form-row">
          <label>选择SKU <select id="outSKU" required></select></label>
          <label>数量 <input id="outQty" type="number" min="1" value="1" required /></label>
          <label>单价 <input id="outPrice" type="number" step="0.01" min="0" placeholder="0.00" /></label>
        </div>
        <div class="form-row">
          <label>备注 <input id="outRemark" type="text" placeholder="销售去向等" /></label>
          <label>操作人 <input id="outOp" type="text" placeholder="操作人" /></label>
        </div>
        <p class="error" id="outError"></p>
        <button class="btn btn-primary" type="submit">确认出库</button>
      </form>
    </section>

    <!-- 库存 -->
    <section class="page" id="page-inventory">
      <h2>📊 库存一览</h2>
      <div id="inventoryTable"></div>
    </section>

    <!-- 台账 -->
    <section class="page" id="page-ledger">
      <h2>📜 出入库台账</h2>
      <div id="ledgerTable"></div>
    </section>

    <!-- SKU编辑弹窗 -->
    <div class="modal" id="skuModal">
      <div class="modal-content">
        <h3 id="modalTitle">新增SKU</h3>
        <form id="skuForm">
          <input type="hidden" id="skuId" />
          <label>商品名称 <input id="skuName" type="text" required maxlength="60" /></label>
          <label>SKU编码 <input id="skuCode" type="text" required maxlength="30" /></label>
          <label>分类 <input id="skuCat" type="text" placeholder="如：电子配件" /></label>
          <label>单位 <input id="skuUnit" type="text" value="个" maxlength="10" /></label>
          <label>预警库存 <input id="skuAlert" type="number" min="0" value="10" /></label>
          <label>成本价 <input id="skuCost" type="number" step="0.01" min="0" placeholder="0.00" /></label>
          <label>售价 <input id="skuSale" type="number" step="0.01" min="0" placeholder="0.00" /></label>
          <p class="error" id="skuError"></p>
          <div class="modal-actions">
            <button class="btn btn-primary" type="submit">保存</button>
            <button class="btn" type="button" id="btnCancelSKU">取消</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <footer>小型进销存 · 数据存储在服务器 SQLite</footer>
  <script src="app.js"></script>
</body>
</html>
