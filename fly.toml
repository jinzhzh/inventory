# Fly.io configuration
app = "team-inventory"
primary_region = "sin"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-256"
  memory = "256mb"

[mounts]
  source = "inventory_data"
  destination = "/data"