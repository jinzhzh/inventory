name: Deploy - GHCR & Fly.io
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/inventory:latest,ghcr.io/${{ github.repository_owner }}/inventory:${{ github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --app team-inventory --docker-image ghcr.io/${{ github.repository_owner }}/inventory:latest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}